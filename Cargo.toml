[workspace]
members = ["crates/contracts", "crates/audio", "crates/session", "crates/platform", "apps/voice-node"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
schemars = "=0.8.22"
windows = { version = "=0.62.2", default-features = false }
windows-core = "=0.62.2"
