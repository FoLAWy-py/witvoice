[package]
name = "witvoice-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
witvoice-contracts = { path = "../contracts" }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory"] }
